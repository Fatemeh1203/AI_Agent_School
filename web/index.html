<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سامانه‌ی پاسخگویی مدرسه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f4f7;
    --card-bg: #ffffff;
    --header-bg: #1f6f4f;
    --header-fg: #ffffff;
    --bubble-bot-bg: #eef1f5;
    --bubble-bot-fg: #1c1c1c;
    --bubble-user-bg: #1f6f4f;
    --bubble-user-fg: #ffffff;
    --chip-bg: #ffffff;
    --chip-border: #1f6f4f;
    --chip-fg: #1f6f4f;
    --muted: #6b7280;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: #1c1c1c;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card-bg);
    box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }
  header {
    background: var(--header-bg);
    color: var(--header-fg);
    padding: 14px 16px;
    text-align: center;
  }
  header .school-name {
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 4px 0;
  }
  header .school-phone {
    font-size: 13px;
    opacity: 0.9;
    margin: 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.7;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.bot {
    align-self: flex-start;
    background: var(--bubble-bot-bg);
    color: var(--bubble-bot-fg);
    border-bottom-left-radius: 4px;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user-bg);
    color: var(--bubble-user-fg);
    border-bottom-right-radius: 4px;
  }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12.5px;
  }
  #choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 12px 16px;
  }
  .chip {
    border: 1.5px solid var(--chip-border);
    color: var(--chip-fg);
    background: var(--chip-bg);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
  }
  .chip:active { opacity: 0.7; }
  #inputBar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #e5e7eb;
  }
  #inputBar input {
    flex: 1;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14px;
  }
  #inputBar button {
    background: var(--header-bg);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  #inputBar.hidden { display: none; }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    padding: 4px 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1c1f24;
      --bubble-bot-bg: #2a2e35;
      --bubble-bot-fg: #f2f2f2;
      --chip-bg: #1c1f24;
      --muted: #9aa1ab;
    }
    body { color: #f2f2f2; }
    #inputBar { border-top-color: #2a2e35; }
    #inputBar input { background: #2a2e35; border-color: #3a3f47; color: #f2f2f2; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <p class="school-name" id="schoolName">در حال اتصال…</p>
    <p class="school-phone" id="schoolPhone"></p>
  </header>
  <div id="messages"></div>
  <div id="choices"></div>
  <div id="inputBar" class="hidden">
    <input id="textInput" type="text" placeholder="پیام خود را بنویسید…" />
    <button id="sendBtn">ارسال</button>
  </div>
</div>

<script>
// ====== تنظیمات — بعد از استقرار مدرسه روی دامنه‌ی نهایی این دو مقدار را عوض کنید ======
const WEBHOOK_URL = 'REPLACE_WITH_N8N_WEBHOOK_URL'; // مثال: https://n8n.example.com/webhook/hadaf-web-chat
const API_KEY = 'REPLACE_WITH_X_API_KEY';
// یادداشت امنیتی: چون این صفحه یک فایل استاتیک بدون بک‌اند است، هر کلیدی که در جاوااسکریپت
// این صفحه قرار گیرد از طریق «Network» مرورگر قابل مشاهده است و یک راز واقعی محسوب نمی‌شود.
// این کلید فقط ورودی‌های ناخواسته‌ی ساده را فیلتر می‌کند؛ محافظت اصلی در برابر سوءاستفاده،
// نرخ‌محدودسازی سمت n8n (WF-WEB) است. برای محرمانگی واقعی باید یک پراکسی سمت سرور
// جلوی Webhook قرار گیرد که کلید را خودش تزریق کند.
// ======================================================================================

const SESSION_KEY = 'hadaf_session_id';
const CACHE_META_KEY = 'hadaf_meta_cache';

function getSessionId() {
  try {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = 'web-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  } catch (e) {
    return 'web-' + Math.random().toString(36).slice(2);
  }
}

function cacheMeta(meta) {
  try { localStorage.setItem(CACHE_META_KEY, JSON.stringify(meta)); } catch (e) {}
}
function readCachedMeta() {
  try {
    const raw = localStorage.getItem(CACHE_META_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

const messagesEl = document.getElementById('messages');
const choicesEl = document.getElementById('choices');
const inputBar = document.getElementById('inputBar');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const schoolNameEl = document.getElementById('schoolName');
const schoolPhoneEl = document.getElementById('schoolPhone');

function addBubble(text, who) {
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemNote(text) {
  const div = document.createElement('div');
  div.className = 'bubble system';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderChoices(choices) {
  choicesEl.innerHTML = '';
  (choices || []).forEach(function (c) {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = c.label;
    btn.addEventListener('click', function () {
      addBubble(c.label, 'user');
      choicesEl.innerHTML = '';
      sendToServer({ type: 'choice', value: c.id });
    });
    choicesEl.appendChild(btn);
  });
}

function setExpectsInput(expectsInput) {
  if (expectsInput && expectsInput.type === 'text') {
    inputBar.classList.remove('hidden');
    textInput.focus();
  } else {
    inputBar.classList.add('hidden');
  }
}

function applyResponse(data) {
  if (data.meta && (data.meta.schoolName || data.meta.officePhone)) {
    cacheMeta(data.meta);
    renderHeader(data.meta);
  }
  (data.messages || []).forEach(function (m) { addBubble(m, 'bot'); });
  renderChoices(data.choices);
  setExpectsInput(data.expectsInput);
}

function renderHeader(meta) {
  schoolNameEl.textContent = meta.schoolName || 'سامانه‌ی پاسخگویی مدرسه';
  schoolPhoneEl.textContent = meta.officePhone ? ('تلفن دفتر: ' + meta.officePhone) : '';
}

function showOfflineFallback() {
  const cached = readCachedMeta();
  if (cached && cached.officePhone) {
    renderHeader(cached);
    addSystemNote('در حال حاضر امکان اتصال به سامانه نیست. برای پیگیری با دفتر مدرسه تماس بگیرید: ' + cached.officePhone);
  } else {
    schoolNameEl.textContent = 'سامانه‌ی پاسخگویی مدرسه';
    schoolPhoneEl.textContent = '';
    addSystemNote('در حال حاضر امکان اتصال به سامانه نیست. لطفاً بعداً دوباره تلاش کنید یا با دفتر مدرسه تماس بگیرید.');
  }
}

async function sendToServer(input) {
  choicesEl.innerHTML = '';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'در حال پاسخ…';
  messagesEl.appendChild(typing);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': API_KEY
      },
      body: JSON.stringify({ sessionId: getSessionId(), input: input })
    });
    typing.remove();
    if (!res.ok) {
      showOfflineFallback();
      return;
    }
    const data = await res.json();
    applyResponse(data);
  } catch (err) {
    typing.remove();
    showOfflineFallback();
  }
}

sendBtn.addEventListener('click', function () {
  const val = textInput.value.trim();
  if (!val) return;
  addBubble(val, 'user');
  textInput.value = '';
  sendToServer({ type: 'text', value: val });
});
textInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') sendBtn.click();
});

// شروع مکالمه
sendToServer({ type: 'choice', value: 'show_menu' });
</script>
</body>
</html>
